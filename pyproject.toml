[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safetensors-print"
dynamic = ["version"]
description = "Print the header, metadata and complete data-segment layout of a .safetensors file"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Andrew Benson", email = "db@nuclearcyborg.com" }]
keywords = ["safetensors", "machine-learning", "tensors", "cli", "inspect"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/drewster99/safetensors-print"
Source = "https://github.com/drewster99/safetensors-print"
Issues = "https://github.com/drewster99/safetensors-print/issues"

[project.scripts]
safetensors-print = "safetensors_print.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.version]
path = "src/safetensors_print/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/safetensors_print"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
