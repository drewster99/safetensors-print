# Publishes to PyPI via trusted publishing (OpenID Connect), so no API token is
# stored in this repository.
#
# One-time setup on PyPI, under the project's Publishing settings, add a pending
# publisher with:
#   Owner: drewster99   Repository: safetensors-print
#   Workflow: publish.yml   Environment: pypi
#
# Then publishing is: bump __version__, tag, and create a GitHub release.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Confirm the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          packaged=$(ls dist/*.tar.gz | sed -E 's/.*safetensors_print-(.+)\.tar\.gz/\1/')
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "tag $tagged does not match packaged version $packaged" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
